name: Trigger and Monitor Workflows

on:
  workflow_dispatch:

jobs:
  trigger-and-monitor:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Workflow Monitor
        shell: pwsh
        run: |
          $token = "${{ secrets.GITHUB_TOKEN }}"
          $csvPath = "${{ github.workspace }}/release.csv"

          $entries = Import-Csv -Path $csvPath

          $triggeredWorkflows = @()
          $statusTable = @()

          foreach ($entry in $entries) {
              $repo        = $entry.repo.Trim()
              $workflow    = $entry.workflow.Trim()
              $ref         = $entry.ref.Trim()
              $refType     = $entry.refType.Trim().ToLower()
              $environment = $entry.environment.Trim()

              Write-Host "`nTriggering $workflow on $repo using $refType $ref in $environment" -ForegroundColor Cyan

              $url = "https://api.github.com/repos/$repo/actions/workflows/$workflow/dispatches"

              $headers = @{
                  Authorization = "Bearer $token"
                  Accept        = "application/vnd.github+json"
                  "User-Agent"  = "PowerShell"
              }

              $body = @{
                  ref = $ref
                  inputs = @{
                      environment = $environment
                  }
              } | ConvertTo-Json -Depth 3

              try {
                  Invoke-RestMethod -Uri $url -Method POST -Headers $headers -Body $body
                  Write-Host "✅ Triggered $repo - $workflow"
                  $triggeredWorkflows += [PSCustomObject]@{
                      Repo        = $repo
                      Workflow    = $workflow
                      Ref         = $ref
                      Environment = $environment
                      RunId       = ""
                      Status      = "queued"
                      Conclusion  = ""
                      Url         = ""
                  }
              } catch {
                  Write-Host "❌ Failed to trigger $repo - $workflow: $($_.Exception.Message)" -ForegroundColor Red
              }
          }

          Write-Host "`nMonitoring workflows..."

          do {
              Start-Sleep -Seconds 5
              $allCompleted = $true

              $statusTable.Clear()

              foreach ($wf in $triggeredWorkflows) {
                  if (-not $wf.RunId) {
                      # Get latest run
                      $runsUrl = "https://api.github.com/repos/$($wf.Repo)/actions/workflows/$($wf.Workflow)/runs"
                      try {
                          $runs = Invoke-RestMethod -Uri $runsUrl -Headers $headers -Method Get
                          if ($runs.workflow_runs.Count -gt 0) {
                              $latestRun = $runs.workflow_runs | Where-Object { $_.head_branch -eq $wf.Ref -or $_.head_sha -eq $wf.Ref } | Select-Object -First 1
                              if ($latestRun) {
                                  $wf.RunId = $latestRun.id
                              }
                          }
                      } catch {
                          Write-Host "Error fetching runs for $($wf.Repo): $($_.Exception.Message)"
                      }
                  }

                  if ($wf.RunId) {
                      $runUrl = "https://api.github.com/repos/$($wf.Repo)/actions/runs/$($wf.RunId)"
                      try {
                          $run = Invoke-RestMethod -Uri $runUrl -Headers $headers -Method Get
                          $status = switch ($run.status) {
                              "in_progress" { "running" }
                              "queued" { "queued" }
                              "waiting" { "waiting for approval" }
                              "completed" { "completed" }
                              default { $run.status }
                          }
                          $conclusion = $run.conclusion

                          if ($status -ne "completed") {
                              $allCompleted = $false
                          }

                          $statusTable += [PSCustomObject]@{
                              Repo        = $wf.Repo
                              Workflow    = $wf.Workflow
                              Ref         = $wf.Ref
                              Environment = $wf.Environment
                              RunId       = $wf.RunId
                              Status      = $status
                              Conclusion  = $conclusion
                              Url         = $run.html_url
                          }
                      } catch {
                          Write-Host "Error fetching run $($wf.RunId): $($_.Exception.Message)"
                          $allCompleted = $false
                      }
                  } else {
                      $statusTable += [PSCustomObject]@{
                          Repo        = $wf.Repo
                          Workflow    = $wf.Workflow
                          Ref         = $wf.Ref
                          Environment = $wf.Environment
                          RunId       = "N/A"
                          Status      = "not found"
                          Conclusion  = ""
                          Url         = "N/A"
                      }
                      $allCompleted = $false
                  }
              }

              Write-Host "`n=== Workflow Status ==="
              $statusTable | Format-Table -AutoSize

          } while (-not $allCompleted)

          Write-Host "`nAll workflows completed."
