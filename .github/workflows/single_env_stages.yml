name: single_env_stages

on:
  workflow_dispatch:

jobs:
  build-dev:
    name: Deploy to Dev
    runs-on: ubuntu-lates
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Dev
        run: echo "Deploying application to DEV environment..."

  deploy-uat-web:
    name: Deploy Web Apps to UAT
    runs-on: ubuntu-latest
    needs: build-dev
    environment: uat
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy Web App
        run: echo "Deploying Web App to UAT..."

  deploy-uat-func:
    name: Deploy Function Apps to UAT
    runs-on: ubuntu-latest
    needs: deploy-uat-web
    environment: uat
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy Function App
        run: echo "Deploying Function App to UAT..."

  deploy-uat-db:
    name: Deploy Database to UAT
    runs-on: ubuntu-latest
    needs: deploy-uat-func
    environment: uat
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy Database
        run: echo "Deploying Database to UAT..."
